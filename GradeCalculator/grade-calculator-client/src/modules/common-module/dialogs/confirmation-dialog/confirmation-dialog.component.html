<h2 mat-dialog-title>{{data.title}}</h2>

<mat-dialog-content>
    <p>{{ data.content }}</p>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-raised-button color="accent" [mat-dialog-close]="false">Cancel</button>
  <button mat-raised-button [mat-dialog-close]="true" cdkFocusInitial>Confirm</button>
</mat-dialog-actions>
